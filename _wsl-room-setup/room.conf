# =============================================================================
# 部屋の設定ファイル（New-SecureRoom.ps1 が部屋を作るときに使います）
#
# 書き方: 「名前 = 値」。# で始まる行はコメント（説明書き）です。
# 保存するときの文字コードは UTF-8 にしてください（メモ帳の既定は UTF-8 です）。
# =============================================================================

# 部屋の中で使う Linux のユーザー名。
# 部屋を作るときにユーザー名を聞かれたら、ここに書いた名前と同じものを入力してください。
# 半角英小文字で始まり、英小文字・数字・_・- だけを使った 32 文字以内の名前にします（例: taro）。
linux_user = 

# Windows のユーザーフォルダの名前（C:\Users\<ここ> の部分）。
# VS Code の拡張機能フォルダ（C:\Users\<ここ>\.vscode\extensions）を、
# 部屋に読み取り専用で見せるために使います。エクスプローラーで C:\Users を開くと確認できます。
# 半角英数字と . _ - だけに対応しています（スペースや日本語を含む名前は未対応）。
windows_user = 

# Claude Code のサンドボックスの中で動くコマンドが、通信してよいドメイン。
# カンマ（,）で区切って並べます。ここに無いドメインへの通信はブロックされます。
#   - 「*.example.com」と書くと example.com のすべてのサブドメインを許可します。
#   - 「*」だけ（すべて許可）は、サンドボックスの意味がなくなるため使えません。
#   - 許可するドメインを増やすほど、データを外へ持ち出される経路も増えます。
#     必要なものだけを書いてください。
allowed_domains = registry.npmjs.org, pypi.org, files.pythonhosted.org
