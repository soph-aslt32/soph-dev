# =============================================================================
# GitHub の設定ファイル（New-SecureRoom.ps1 が部屋を作るときに使います。使わない場合は空欄のまま）
#
# 4 つの項目をすべて記入すると、部屋を作るときに一度だけ、次のことを自動で行います。
#   - git の設定（コミットの作者名・メールアドレス、認証情報の保存方法）
#   - PAT の保存（部屋の ~/.git-credentials。Claude Code からは読めないように設定されます）
#   - repo_url のリポジトリを、部屋の ~/projects/<リポジトリ名> にクローン
# すべて空欄なら何もしません。一部だけ記入されていると、部屋を作る前に止まります。
#
# room.conf と違い、このファイルは部屋の中へコピーされません（PAT を部屋に持ち込まないため）。
#   - 記入は、Windows 側にコピーしたフォルダ（room.conf と同じ場所）で行ってください。
#     部屋の中のファイルは、その部屋で動く Claude Code から読めることがあります。
#   - 部屋ができたら、空欄に戻してください。
#
# 書き方: 「名前 = 値」。# で始まる行はコメント（説明書き）です。
# 保存するときの文字コードは UTF-8 にしてください（メモ帳の既定は UTF-8 です）。
# =============================================================================

# コミットに作者として記録される名前（git の user.name）。
# GitHub のアカウントと関係のないダミーで構いません（例: dev-room）。制御文字と < > は使えません。
user_name = 

# コミットに作者として記録されるメールアドレス（git の user.email）。
# ダミーで構いませんが、実在する誰かのアドレスと偶然一致すると、GitHub がその人のコミットとして表示します。
# example.com などの例示用のドメインを使うと確実です（例: dev-room@example.com）。
user_email = 

# GitHub の Personal Access Token（github_pat_ や ghp_ で始まる文字列）。
# fine-grained PAT で、対象のリポジトリだけ・Contents の Read and write・有効期限付きで作ることをおすすめします。
pat = 

# クローンするリポジトリ（https://github.com/OWNER/REPOSITORY.git の形。SSH の git@github.com:... は使えません）。
repo_url = 
