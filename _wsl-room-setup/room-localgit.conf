# =============================================================================
# LocalGit の設定ファイル（New-SecureRoom.ps1 が部屋を作るときに使います。使わない場合は空欄のまま）
#
# Windows 側にある bare リポジトリ（GitHub に置けないコードの正本）を、部屋の中で使えるようにします。
# repo_path を記入すると、部屋を作るときに次のことを自動で行います。
#   - repo_path のリポジトリの内容（すべてのブランチ・タグ・履歴）を、部屋の ~/repos/<名前>.git に写す
#   - それを部屋の ~/projects/<名前> にクローンする
#   - この部屋専用の同期スクリプト（このフォルダの rooms\<部屋の名前>\Sync-<部屋の名前>.cmd）を作る
# <名前> は、repo_path のフォルダ名から末尾の .git を除いたものです（例: C:\repos\foo.git → foo）。
#
# room-github.conf と、どちらか一方だけに記入してください（両方に記入すると、部屋を作る前に止まります）。
# このファイルは部屋の中へコピーしません。
#
# 書き方: 「名前 = 値」。# で始まる行はコメント（説明書き）です。
# 保存するときの文字コードは UTF-8 にしてください（メモ帳の既定は UTF-8 です）。
# =============================================================================

# Windows 側の bare リポジトリのフォルダ（git init --bare で作ったもの。HEAD・config・objects・refs などが直接入っているフォルダ）。
# ドライブ名から書きます（例: C:\repos\foo.git）。ネットワークドライブや \\ で始まる場所は使えません。
# フォルダ名（末尾の .git を除く）は、半角英数字と . _ - だけにしてください。
repo_path =
