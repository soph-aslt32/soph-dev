# =============================================================================
# 入力の既定値（setup-wizard.cmd が、新しい開発環境を作るときに使います）
#
# 書き方: 「名前 = 値」。# で始まる行はコメント（説明書き）です。
# 保存するときの文字コードは UTF-8 にしてください（メモ帳の既定は UTF-8 です）。
# 開発環境ごとの値は、ここには書きません（setup-wizard.cmd の画面で入力します）。
# =============================================================================

# 開発環境のコンテナが、通信してよいドメインの既定値（Claude Code が動くのに要るドメインは、ツールが別に許可します）。
# setup-wizard.cmd で新しい開発環境を作るとき、Enter だけ押すとこの値になります（画面で変えられます）。
# カンマ（,）で区切って並べます。ここに無いドメインへの通信は、コンテナのファイアウォールで止まります。
#   - 「*.example.com」のように、サブドメインをまとめて許す書き方は使えません。
#     ファイアウォールは、コンテナを起動するときにドメインごとに IP アドレスを引くためです。
#     使うサブドメインを 1 つずつ書いてください（例: api.example.com, cdn.example.com）。
#   - 「*」だけ（すべて許可）も使えません。
#   - 許可するドメインを増やすほど、データを外へ持ち出される経路も増えます。
#     必要なものだけを書いてください。
allowed_domains = registry.npmjs.org, pypi.org, files.pythonhosted.org
